name: Claude

# Deliberate, gated automation: add the "claude" label to an issue to have Claude implement it
# and open a PR, or mention @claude in an issue/PR comment. Spends API tokens, so keep it manual.
on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issues' && github.event.label.name == 'claude') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write   # the action fetches an OIDC token even when using an API key
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for context
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Use the workflow's own token so we don't need the Claude GitHub App installed.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Let Claude verify its change before opening the PR (Read/Edit/Write are allowed by default).
          claude_args: '--allowedTools "Bash(./gradlew:*),Bash(git:*)"'

      # The action pushes a claude/issue-N-* branch but stops at a "Create PR" link; open the PR
      # automatically. Same job (a GITHUB_TOKEN push won't trigger a separate on:push workflow).
      - name: Auto-open the PR
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          BRANCH=$(gh api "repos/$REPO/branches" --paginate \
            --jq ".[].name | select(startswith(\"claude/issue-$ISSUE-\"))" | sort | tail -1)
          if [ -z "$BRANCH" ]; then echo "No claude branch for #$ISSUE — nothing to open."; exit 0; fi
          if [ -n "$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number --jq '.[0].number')" ]; then
            echo "A PR is already open for $BRANCH."; exit 0
          fi
          TITLE=$(gh api "repos/$REPO/commits/$BRANCH" --jq '.commit.message' | head -1)
          gh pr create --repo "$REPO" --base master --head "$BRANCH" \
            --title "$TITLE" --body "Closes #$ISSUE — auto-opened by the Claude issue→PR loop."

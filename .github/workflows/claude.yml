name: Claude

# Deliberate, gated automation: add the "claude" label to an issue to have Claude implement it
# and open a PR, or mention @claude in an issue/PR comment. Spends API tokens, so keep it manual.
on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issues' && github.event.label.name == 'claude') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for context
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Let Claude verify its change before opening the PR (Read/Edit/Write are allowed by default).
          claude_args: '--allowedTools "Bash(./gradlew:*),Bash(git:*)"'

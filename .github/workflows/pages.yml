# Publishes site/ (the landing page the printed QR codes point to, feltbok.fyhn.lol) to GitHub Pages.
# The badges and icon are symlinks into docs/ and fastlane/; the upload follows them.
name: Pages

on:
  push:
    branches: [master]
    paths:
      - 'site/**'
      - 'docs/badges/**'
      - 'fastlane/metadata/android/en-US/images/icon.png'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

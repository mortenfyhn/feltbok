# Builds the iOS app (#115) and runs its launch smoke test (iosApp/ci-test.sh) on GitHub's macOS
# runners, which are free for public repos. Android, the shared modules' tests and the Python run on
# Semaphore (.semaphore/semaphore.yml); this only covers what needs a Mac.
name: iOS

on:
  push:
    # Docs-only pushes can't break the build.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'fastlane/**'
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe, for the in-app version string
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Kotlin/Native's toolchain and dependencies (~1 GB), downloaded on first use.
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('build.gradle.kts', 'shared/build.gradle.kts', 'ui/build.gradle.kts') }}
          restore-keys: konan-${{ runner.os }}-
      # detekt for iosMain, which only exists on macOS (Semaphore runs the rest: detektAll). Detekt
      # has no type resolution for native targets, so the rules that need it (such as the `!!` ban)
      # don't run here.
      - run: ./gradlew :ui:detektIosMainSourceSet
      - run: brew install xcodegen
      - run: iosApp/ci-test.sh

# Runs the instrumented tests (`just itest`: R8 smoke tests and UI flows on the minified releaseTest
# variant) on an Android emulator (#201). They run here rather than on Semaphore because Semaphore's
# Android job is a container without KVM, and an emulator without it is too slow to use. GitHub's
# Linux runners have KVM and are free for public repos.
name: Android instrumented tests

on:
  push:
    # Docs-only pushes can't break the build.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'fastlane/**'
      - 'site/**'
  workflow_dispatch:

concurrency:
  group: android-itest-${{ github.ref }}
  cancel-in-progress: true

env:
  API_LEVEL: 35

jobs:
  itest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git describe, for the in-app version string
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          # Branches save their own cache too (by default only master does), so the second push to a
          # branch builds warm: 20 s instead of 4 min.
          cache-read-only: false
      # Lets the emulator use KVM.
      - run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Build before booting the emulator, so the build doesn't compete with it for CPU.
      - run: ./gradlew assembleReleaseTest assembleReleaseTestAndroidTest --console=plain
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # The same small phone as `just emu`. The launch test needs the activity RESUMED, so keep
          # the screen on and unlocked.
          script: |
            adb shell wm size 1080x2280 && adb shell wm density 480
            adb shell svc power stayon true && adb shell wm dismiss-keyguard
            ./gradlew connectedReleaseTestAndroidTest --console=plain
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: itest-reports
          path: |
            app/build/reports/androidTests/connected
            app/build/outputs/androidTest-results/connected

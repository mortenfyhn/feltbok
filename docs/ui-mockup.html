<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feltbok – UI-skisse</title>
<style>
  :root{
    --bg:#eef1f0; --card:#fff; --ink:#1c2624; --muted:#6b7a76;
    --accent:#1f7a64; --accent-d:#155a49; --line:#e6eae9; --warn:#c2761b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:#cdd4d2;font:16px/1.35 system-ui,Segoe UI,Roboto,sans-serif;color:var(--ink)}
  i,.sci{font-style:italic}
  .wrap{display:flex;flex-wrap:wrap;gap:20px;justify-content:center;align-items:flex-start;padding:24px}
  .phone{width:380px;height:760px;background:var(--bg);border-radius:34px;
    border:10px solid #11201c;overflow:hidden;position:relative;box-shadow:0 12px 40px rgba(0,0,0,.35)}
  .screen{position:absolute;inset:0;display:none;flex-direction:column}
  .screen.on{display:flex}
  .body{flex:1;overflow:auto}
  /* list top strip */
  .strip{background:var(--accent);color:#fff;padding:11px 14px;display:flex;align-items:center;gap:7px;font-size:14px}
  .strip b{font-weight:650}
  .strip .ok{background:#2c9b7f;padding:1px 8px;border-radius:10px;font-size:12px}
  .strip.wait .ok{background:var(--warn)}
  .strip .exp{margin-left:auto;color:#fff;font-weight:600;background:rgba(255,255,255,.16);border:0;border-radius:9px;padding:6px 11px;font-size:13px}
  .strip .exp:disabled{opacity:.45}
  .scount{padding:9px 16px;color:var(--muted);font-size:13px}
  /* list rows */
  .row{background:var(--card);display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
  .row .mid{flex:1;min-width:0}
  .row .sp{font-weight:600}
  .row .sp .ct{color:var(--accent-d)}
  .row .sci{color:var(--muted);font-size:13px}
  .row .meta{color:var(--muted);font-size:12.5px;margin-top:2px}
  .row .rt{text-align:right;color:var(--muted);font-size:12.5px;white-space:nowrap}
  .row .rt .loc{color:var(--ink);font-weight:500}
  .row .chev{color:#b8c2bf;font-size:20px}
  .fab{position:absolute;right:18px;bottom:20px;width:62px;height:62px;border-radius:50%;
    background:var(--accent);color:#fff;border:0;font-size:33px;box-shadow:0 6px 16px rgba(0,0,0,.3)}
  /* search (top input + inline cancel; no title bar) */
  .searchtop{display:flex;gap:8px;align-items:center;padding:12px 12px 10px;background:var(--card);border-bottom:1px solid var(--line)}
  .searchtop input{flex:1;padding:12px 14px;border:1px solid var(--line);border-radius:11px;font-size:16px;background:#f4f7f6}
  .searchtop .lnk{color:var(--accent);background:none;border:0;font-size:15px;font-weight:600;padding:8px 4px}
  .sec{padding:12px 16px 4px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
  .opt{background:var(--card);padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:baseline}
  /* detail field rows (no title bar) */
  .frow{background:var(--card);display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);min-height:54px}
  .frow label{color:var(--muted);min-width:84px;font-size:14px}
  .frow .val{flex:1;text-align:right;font-weight:550}
  .frow .val .d{color:var(--muted);font-weight:400;font-size:13px;margin-left:6px}
  .frow .val.empty{color:#aab4b1;font-weight:400}
  .frow.tap .val::after{content:"›";color:#c2ccc9;margin-left:8px;font-size:18px}
  .frow .selwrap{flex:1;display:flex;justify-content:flex-end;align-items:center}
  .frow .selwrap::after{content:"›";color:#c2ccc9;margin-left:8px;font-size:18px;pointer-events:none}
  .frow select{text-align:right;border:0;background:none;font:inherit;color:var(--ink);font-weight:550;
    -webkit-appearance:none;appearance:none;text-align-last:right}
  .stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .stepper button{width:42px;height:38px;border:0;background:#f1f5f4;font-size:20px;color:var(--accent-d)}
  .stepper .q{width:48px;text-align:center;font-weight:700;font-size:18px}
  .ca{padding:8px 16px 4px;background:var(--card);border-bottom:1px solid var(--line)}
  .ca label{display:block;color:var(--muted);font-size:13px;margin:8px 0 4px}
  .ca textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;resize:none;background:#f8faf9}
  /* bottom action bar */
  .actbar{display:flex;gap:10px;padding:11px 14px;background:var(--card);border-top:1px solid var(--line)}
  .actbar button{border:0;border-radius:12px;padding:15px;font-size:16px;font-weight:650}
  .actbar .secondary{flex:1;background:#eceeed;color:var(--ink)}
  .actbar .primary{flex:1.7;background:var(--accent);color:#fff}
  /* locality picker */
  .locrow{background:var(--card);padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
  .locrow .mark{font-size:15px;color:var(--accent)}
  .locrow .lname{flex:1;font-weight:600}
  .locrow .lsub{color:var(--muted);font-size:12.5px;font-weight:400;margin-top:1px}
  .locrow .dist{color:var(--muted);font-size:13px}
  /* export modal */
  .modal{position:absolute;inset:0;background:rgba(10,20,18,.45);display:none;align-items:center;justify-content:center;padding:20px}
  .modal.on{display:flex}
  .sheet{background:#fff;border-radius:16px;width:100%;max-height:82%;display:flex;flex-direction:column;overflow:hidden}
  .sheet h2{margin:0;padding:15px 16px;font-size:17px;border-bottom:1px solid var(--line)}
  .sheet .hint{padding:10px 16px;color:var(--muted);font-size:13px}
  .sheet textarea{margin:0 16px;height:160px;border:1px solid var(--line);border-radius:10px;padding:10px;font:12px/1.4 monospace;white-space:pre;overflow:auto}
  .sheet .acts{display:flex;gap:10px;padding:14px 16px}
  .sheet .acts button{flex:1;border:0;border-radius:11px;padding:12px;font-weight:650}
  .sheet .copy{background:var(--accent);color:#fff}
  .sheet .close{background:#eceeed;color:var(--ink)}
  /* theme picker (skisse only) */
  .panel{background:#fff;border-radius:14px;padding:14px 16px;width:230px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
  .panel h3{margin:0 0 8px;font-size:14px}
  .swatch{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--line);background:#fff;
    border-radius:10px;padding:9px 11px;margin-bottom:8px;font-size:14px;cursor:pointer}
  .swatch .dot{width:20px;height:20px;border-radius:6px}
  .panel .note{color:var(--muted);font-size:12px;margin-top:4px}
</style>
</head>
<body>
<div class="wrap">
  <div class="phone">

    <!-- ---- LIST ---- -->
    <section class="screen on" id="s-list">
      <div class="strip" id="gpsbar"></div>
      <div class="body">
        <div class="scount" id="count"></div>
        <div id="notes"></div>
      </div>
      <button class="fab" onclick="startAdd()">＋</button>
    </section>

    <!-- ---- SPECIES SEARCH ---- -->
    <section class="screen" id="s-search">
      <div class="searchtop">
        <input id="sp-q" placeholder="Søk art…" oninput="renderSpecies()" autocomplete="off">
        <button class="lnk" onclick="cancelSearch()">Avbryt</button>
      </div>
      <div class="body"><div id="splist"></div></div>
    </section>

    <!-- ---- DETAIL ---- -->
    <section class="screen" id="s-detail">
      <div class="body">
        <div class="frow tap" onclick="openLocPicker()"><label>Lokalitet</label><span class="val" id="d-loc">—</span></div>
        <div class="frow tap" onclick="changeSpecies()"><label>Art</label><span class="val" id="d-sp">—</span></div>
        <div class="frow"><label>Antall</label><div style="flex:1"></div>
          <div class="stepper"><button onclick="bump(-1)">−</button><span class="q" id="d-n">1</span><button onclick="bump(1)">＋</button></div></div>
        <div class="frow"><label>Alder</label><div class="selwrap"><select id="d-age" onchange="markEmpty(this)"></select></div></div>
        <div class="frow"><label>Aktivitet</label><div class="selwrap"><select id="d-act" onchange="markEmpty(this)"></select></div></div>
        <div class="frow"><label>Kjønn</label><div class="selwrap"><select id="d-sex" onchange="markEmpty(this)"></select></div></div>
        <div class="ca">
          <label>Åpen kommentar</label><textarea id="d-pub" rows="2"></textarea>
          <label>Privat kommentar</label><textarea id="d-priv" rows="2"></textarea>
        </div>
        <div class="frow tap"><label>Dato</label><span class="val" id="d-date">31. mai 2026</span></div>
        <div class="frow tap"><label>Tid</label><span class="val" id="d-time">08:14</span></div>
      </div>
      <div class="actbar">
        <button class="secondary" onclick="show('s-list')">Avbryt</button>
        <button class="primary" onclick="saveNote()">Lagre</button>
      </div>
    </section>

    <!-- ---- LOCALITY PICKER ---- -->
    <section class="screen" id="s-loc">
      <div class="searchtop">
        <input id="loc-q" placeholder="Søk lokalitet…" oninput="renderLocs()" autocomplete="off">
        <button class="lnk" onclick="show('s-detail')">Avbryt</button>
      </div>
      <div class="body"><div class="scount">Sortert nærmest → fjernest</div><div id="loclist"></div></div>
    </section>

    <!-- ---- EXPORT MODAL ---- -->
    <div class="modal" id="modal">
      <div class="sheet">
        <h2>Eksporter til Artsobservasjoner</h2>
        <div class="hint">Lim inn i <b>Importer observasjoner</b> (gammel side). Navn + registrert koordinat kobles til offisiell lokalitet.</div>
        <textarea id="tsv" readonly></textarea>
        <div class="acts"><button class="close" onclick="closeExport()">Lukk</button><button class="copy" onclick="copyTsv(this)">Kopiér</button></div>
      </div>
    </div>

  </div>

  <!-- theme comparison (mockup only) -->
  <div class="panel">
    <h3>Grønne temaer</h3>
    <button class="swatch" onclick="setTheme('#1f7a64','#155a49')"><span class="dot" style="background:#1f7a64"></span>Teal-grønn</button>
    <button class="swatch" onclick="setTheme('#2f6d3a','#1f4d27')"><span class="dot" style="background:#2f6d3a"></span>Skoggrønn</button>
    <button class="swatch" onclick="setTheme('#1d5e4b','#123f33')"><span class="dot" style="background:#1d5e4b"></span>Furugrønn (dyp)</button>
    <button class="swatch" onclick="setTheme('#5b7a2b','#3f5a1c')"><span class="dot" style="background:#5b7a2b"></span>Mosegrønn (olivengrønn)</button>
    <div class="note">Trykk for å bytte aksentfarge i skissen.</div>
  </div>
</div>

<script>
const AGES=["Egg","Pulli","Adult","1K","1K+","2K","2K+","2K-","3K","3K+","3K-","4K","4K+","4K-","5K","5K+","5K-","6K","6K+","6K-","7K","7K+","7K-"];
const ACTS=["Rastende","Stasjonær","Næringssøkende","Sang/spill, ikke hekking","Overflygende","Trekkende",
  "Trekkende mot N","Trekkende mot NØ","Trekkende mot Ø","Trekkende mot S","Trekkende mot V",
  "Reir med egg eller unger","Mat til unger","Rugende","Lokkelyd, øvrige lyder"];
const SEX=["Hann","Hunn","Hunnfarget","I par"];
const SPECIES=[
  ["Kjøttmeis","Parus major"],["Blåmeis","Cyanistes caeruleus"],["Gråspurv","Passer domesticus"],
  ["Pilfink","Passer montanus"],["Gråtrost","Turdus pilaris"],["Sivspurv","Emberiza schoeniclus"],
  ["Tårnfalk","Falco tinnunculus"],["Tornsanger","Curruca communis"],["Møller","Curruca curruca"],
  ["Vipe","Vanellus vanellus"],["Låvesvale","Hirundo rustica"],["Svartbak","Larus marinus"],
  ["Gjøk","Cuculus canorus"],["Tyrkerdue","Streptopelia decaocto"],["Ærfugl","Somateria mollissima"],
  ["Storspove","Numenius arquata"],["Rødstrupe","Erithacus rubecula"],["Bokfink","Fringilla coelebs"]];
const RECENT=["Kjøttmeis","Gråtrost","Ærfugl","Sivspurv","Ærfugl"].filter((v,i,a)=>a.indexOf(v)===i);
const LOCS=[ // navn, hovedlok, kommune, lat, lon, avstand(m)
  ["Ørndalen","Sistranda","Frøya",63.72865,8.81729,120],
  ["Øvre Midtsian","Sistranda","Frøya",63.72823,8.82385,380],
  ["Lærarbyen","Sistranda","Frøya",63.72730,8.82962,520],
  ["Litsvasskogen sør","","Frøya",63.73023,8.80530,700],
  ["Flatvalsundet","Flatval","Frøya",63.68704,8.75778,1200],
  ["Ellingsundet","Uttian","Frøya",63.76564,8.82686,3400],
  ["Saltnesvågen","Uttian","Frøya",63.76516,8.85196,3600]];

let notes=[], cur=null, curLoc=LOCS[0], changingSpecies=false, gpsSettled=true;
const $=id=>document.getElementById(id);
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));$(id).classList.add('on')}
function fillSelect(el,arr){el.innerHTML='<option value="" selected></option>'+arr.map(v=>`<option>${v}</option>`).join('')}
fillSelect($('d-age'),AGES);fillSelect($('d-act'),ACTS);fillSelect($('d-sex'),SEX);
function markEmpty(s){s.classList.toggle('empty',!s.value)}
function dist(m){return m<1000?m+' m':(m/1000).toFixed(1)+' km'}
function ctx(L){return [L[1],L[2]].filter(Boolean).join(', ')}
function setTheme(a,d){const r=document.documentElement.style;r.setProperty('--accent',a);r.setProperty('--accent-d',d)}

function renderGps(){
  const b=$('gpsbar');const exp=`<button class="exp" id="expbtn" onclick="openExport()" ${notes.length?'':'disabled'}>Eksporter</button>`;
  if(gpsSettled)b.outerHTML=`<div class="strip" id="gpsbar">📍 <b>${curLoc[0]}</b>, ${curLoc[2]} <span class="ok">±15 m ✓</span>${exp}</div>`;
  else b.outerHTML=`<div class="strip wait" id="gpsbar">📍 <b>Finner posisjon…</b> <span class="ok">søker</span>${exp}</div>`;
}
function renderNotes(){
  $('count').textContent='I dag · '+notes.length+' '+(notes.length===1?'notat':'notater');
  $('notes').innerHTML=notes.map((n,i)=>{
    const extra=[n.sex,n.act].filter(Boolean).join(' · ');
    return `<div class="row" onclick="editNote(${i})">
      <div class="mid"><div class="sp"><span class="ct">${n.count}</span> ${n.sp}</div>
        <div class="sci">${n.sci}</div>${extra?`<div class="meta">${extra}</div>`:''}</div>
      <div class="rt"><div>${n.time}</div><div class="loc">${n.loc||'…'}</div></div>
      <div class="chev">›</div></div>`}).join('');
  renderGps();
}

// add flow: species first
function startAdd(){cur=null;changingSpecies=false;$('sp-q').value='';renderSpecies();show('s-search')}
function cancelSearch(){show(cur?'s-detail':'s-list')}
function changeSpecies(){changingSpecies=true;$('sp-q').value='';renderSpecies();show('s-search')}
function opt(s){return `<div class="opt" onclick="pickSpecies('${s[0]}')"><span>${s[0]}</span><span class="sci">${s[1]}</span></div>`}
function renderSpecies(){
  const q=$('sp-q').value.trim().toLowerCase();
  if(!q){$('splist').innerHTML='<div class="sec">Nylig brukt</div>'+RECENT.map(n=>opt(SPECIES.find(x=>x[0]===n))).join('')}
  else{const l=SPECIES.filter(s=>s[0].toLowerCase().includes(q)||s[1].toLowerCase().includes(q));
       $('splist').innerHTML=l.length?l.map(opt).join(''):'<div class="scount">Ingen treff – skriv for å søke</div>'}
}
function pickSpecies(name){
  const s=SPECIES.find(x=>x[0]===name);
  if(cur&&changingSpecies){cur.sp=s[0];cur.sci=s[1];changingSpecies=false;openDetail();return}
  cur={sp:s[0],sci:s[1],count:1,age:'',act:'',sex:'',pub:'',priv:'',loc:null,dist:0,lat:null,lon:null,date:'31. mai 2026',time:'08:14',idx:null};
  openDetail();
  setTimeout(()=>{if(cur&&cur.idx==null&&!cur.loc){cur.loc=curLoc[0];cur.dist=curLoc[5];cur.lat=curLoc[3];cur.lon=curLoc[4];setLocLabel()}},1400);
}
function openDetail(){
  $('d-sp').innerHTML=`${cur.sp} <span class="sci" style="font-size:13px;color:var(--muted)">${cur.sci}</span>`;
  $('d-n').textContent=cur.count;
  for(const[id,v]of[['d-age',cur.age],['d-act',cur.act],['d-sex',cur.sex]]){$(id).value=v;markEmpty($(id))}
  $('d-pub').value=cur.pub;$('d-priv').value=cur.priv;$('d-time').textContent=cur.time;
  setLocLabel();show('s-detail');
}
function setLocLabel(){
  const e=$('d-loc');
  if(cur.loc){e.innerHTML=`${cur.loc}<span class="d">${dist(cur.dist)}</span>`;e.classList.remove('empty')}
  else{e.textContent='Finner posisjon…';e.classList.add('empty')}
}
function bump(d){cur.count=Math.max(1,cur.count+d);$('d-n').textContent=cur.count}
function editNote(i){cur=Object.assign({},notes[i],{idx:i});openDetail()}
function saveNote(){
  cur.age=$('d-age').value;cur.act=$('d-act').value;cur.sex=$('d-sex').value;
  cur.pub=$('d-pub').value;cur.priv=$('d-priv').value;
  if(cur.idx==null)notes.unshift(cur);else notes[cur.idx]=cur;
  renderNotes();show('s-list');
}

// locality picker
function openLocPicker(){$('loc-q').value='';renderLocs();show('s-loc')}
function renderLocs(){
  const q=($('loc-q').value||'').toLowerCase();
  $('loclist').innerHTML=LOCS.filter(l=>l[0].toLowerCase().includes(q)).map(l=>{
    const sel=cur&&l[0]===cur.loc;
    return `<div class="locrow" onclick="pickLoc('${l[0]}')">
      <span class="mark">${sel?'●':'○'}</span>
      <span class="lname">${l[0]}<div class="lsub">${ctx(l)}</div></span>
      <span class="dist">${dist(l[5])}</span></div>`}).join('');
}
function pickLoc(name){const L=LOCS.find(l=>l[0]===name);cur.loc=L[0];cur.dist=L[5];cur.lat=L[3];cur.lon=L[4];setLocLabel();show('s-detail')}

// export (v2.20 paste: bare name + registry coord, WGS84 geographic)
const COLS=["Artsnavn","Antall","Alder","Kjønn","Aktivitet","Lokalitetsnavn","Nord","Øst","Nøyaktighet",
  "Fra dato","Fra klokkeslett","Til dato","Til klokkeslett","Kommentar (synlig for alle)","Privat kommentar (kun synlig for deg selv)"];
function openExport(){
  const rows=notes.map(n=>[n.sp,n.count,n.age,n.sex,n.act,n.loc,n.lat,n.lon,"100 m","31.05.2026",n.time,"31.05.2026",n.time,n.pub,n.priv].join('\t'));
  $('tsv').value=[COLS.join('\t'),...rows].join('\n');$('modal').classList.add('on');
}
function closeExport(){$('modal').classList.remove('on')}
function copyTsv(b){navigator.clipboard&&navigator.clipboard.writeText($('tsv').value);b.textContent='Kopiert ✓';setTimeout(()=>b.textContent='Kopiér',1200)}

notes=[
  {sp:"Gråtrost",sci:"Turdus pilaris",count:1,age:'',act:'Sang/spill, ikke hekking',sex:'Hann',pub:'',priv:'',loc:'Ørndalen',dist:120,lat:63.72865,lon:8.81729,date:'31. mai 2026',time:'08:09',idx:null},
  {sp:"Ærfugl",sci:"Somateria mollissima",count:12,age:'',act:'Rastende',sex:'',pub:'',priv:'',loc:'Flatvalsundet',dist:1200,lat:63.68704,lon:8.75778,date:'31. mai 2026',time:'07:52',idx:null}];
renderNotes();
</script>
</body>
</html>

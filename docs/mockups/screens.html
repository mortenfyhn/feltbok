<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feltbok screens</title>

<body>
<h1>Feltbok: the app's screens as mockups</h1>
<p class="why">Starting points for new mockups. Copy a screen's <code>.phone</code> block into your mockup page
and change it. Matched against the emulator on 2026-11-15 (v1.5-22). See README.md.</p>

<div class="screens">

<!-- ===================== LIST (ListScreen) ===================== -->
<figure id="list">
<figcaption>Lista (ListScreen)</figcaption>

  <div class="statusbar">17:10</div>

    <div class="loc"><div class="name">hurtigbåthavna ›</div><div class="sub">14 m unna (GPS ±5 m)</div></div>
    <div class="btn-outline-white">Eksporter</div>
  </div>
  <div class="content">
    <div class="scroll">
      <div class="party"><span class="n">2 <i class="group-icon"></i></span>Kristin, Christian</div>
      <div class="day">I dag · 10 arter (17 totalt)</div>
      <div class="note"><div class="main"><span class="sp"><span><span class="count">4</span> gråmåke</span><span class="rl">VU</span><span class="badge-co">2 <i class="group-icon"></i></span></span><span class="preview">Ad <b>♂</b></span><span class="loc">Ladehammeren</span></div><span class="time">17:05</span></div>
      <div class="note"><div class="main"><span class="sp"><span><span class="count">2</span> gråmåke</span><span class="rl">VU</span><span class="badge-co">2 <i class="group-icon"></i></span></span><span class="preview">1K <b>♀</b></span><span class="loc">Ladehammeren</span></div><span class="time">17:02</span></div>
      <div class="note"><div class="main"><span class="sp"><span><span class="count">?</span> storspove</span><span class="rl">EN</span></span><span class="preview">1K <b>♀</b></span><span class="loc">Ilsvika</span></div><span class="time">16:30</span></div>
      <div class="note"><div class="main"><span class="sp"><span><span class="count">2</span> niland</span><span class="rl alien">SE</span><span class="badge-i">i</span><span class="badge-co">1 <i class="group-icon"></i></span></span><span class="preview">Ad <b>♂♀</b></span><span class="loc">Ilabekken</span></div><span class="time">16:00</span></div>
      <div class="note"><div class="main"><span class="sp"><span><span class="count">12</span> stokkand</span><span class="badge-i private">i</span></span><span class="loc">sjøområdet mellom Brattøra og Munkholmen</span></div><span class="time">15:35</span></div>
      <div class="note"><div class="main"><span class="sp"><span><span class="count">35</span> storskarv</span><span class="rl">NT</span><span class="badge-co">12 <i class="group-icon"></i></span></span><span class="preview">Pu</span><span class="loc">Leangenbukta</span></div><span class="time">15:00</span></div>
      <div class="note"><div class="main"><span class="sp"><span><span class="count">1</span> svartstrupesteinskvett?</span><span class="badge-co">2 <i class="group-icon"></i></span></span><span class="loc">Estenstaddammen</span></div><span class="time">14:30</span></div>
      <div class="note"><div class="main"><span class="sp"><span><span class="count">1</span> kjøttmeis</span></span><span class="loc">Ilsvika</span></div><span class="time">13:50</span></div>
      <div class="note"><div class="main"><span class="sp"><span><span class="count">3</span> svarttrost</span><span class="badge-i">i</span><span class="badge-co">1 <i class="group-icon"></i></span></span><span class="preview">Ad <b>♂</b></span><span class="loc">Baklidammen</span></div><span class="time">13:20</span></div>
      <div class="note"><div class="main"><span class="sp"><span><span class="count">2</span> rådyr</span><span class="badge-i">i</span></span><span class="loc">TKB tredje avdeling</span></div><span class="time">12:30</span></div>
      <div class="note"><div class="main"><span class="sp"><span><span class="count">1</span> kråke</span><span class="badge-i">i</span></span><span class="preview">Ad</span><span class="loc">Haukvatnet</span></div><span class="time">--:--</span></div>
      <div class="day">I går · 10 arter</div>
      <div class="note"><div class="main"><span class="sp"><span><span class="count">1000</span> storspove?</span><span class="rl">EN</span><span class="badge-i">i</span><span class="badge-co">2 <i class="group-icon"></i></span></span><span class="preview">Ad <b>♂</b></span><span class="loc">Kyvatnet</span></div><span class="time">16:10</span></div>
    </div>
    <div class="list-footer"><span>Papirkurv</span><span>Gi tilbakemelding</span><span class="ver">v1.5</span></div>
  </div>

</div>
</figure>

<div class="phone">
  <div class="statusbar">17:12</div>
  <div class="selection-bar"><span class="x">✕</span><span class="count">1 markert</span><span class="act">Endre</span><span class="act">Slett</span><span class="btn-outline-white">Eksporter</span></div>
  <div class="content">
    <div class="scroll">
      <div class="party"><span class="n">2 <i class="group-icon"></i></span>Kristin, Christian</div>
      <div class="day"><span class="sel"></span>I dag · 10 arter (17 totalt)</div>
      <div class="note selected"><span class="sel on"></span><div class="main"><span class="sp"><span><span class="count">4</span> gråmåke</span><span class="rl">VU</span><span class="badge-co">2 <i class="group-icon"></i></span></span><span class="preview">Ad <b>♂</b></span><span class="loc">Ladehammeren</span></div><span class="time">17:05</span></div>
      <div class="note"><span class="sel"></span><div class="main"><span class="sp"><span><span class="count">2</span> gråmåke</span><span class="rl">VU</span><span class="badge-co">2 <i class="group-icon"></i></span></span><span class="preview">1K <b>♀</b></span><span class="loc">Ladehammeren</span></div><span class="time">17:02</span></div>
      <div class="note"><span class="sel"></span><div class="main"><span class="sp"><span><span class="count">?</span> storspove</span><span class="rl">EN</span></span><span class="preview">1K <b>♀</b></span><span class="loc">Ilsvika</span></div><span class="time">16:30</span></div>
      <div class="note"><span class="sel"></span><div class="main"><span class="sp"><span><span class="count">2</span> niland</span><span class="rl alien">SE</span><span class="badge-i">i</span></span><span class="loc">Ilabekken</span></div><span class="time">16:00</span></div>
      <div class="note"><span class="sel"></span><div class="main"><span class="sp"><span><span class="count">12</span> stokkand</span><span class="badge-i private">i</span></span><span class="loc">sjøområdet mellom Brattøra og Munkholmen</span></div><span class="time">15:35</span></div>

<!-- ===================== SEARCH (SearchScreen) ===================== -->
<figure id="search">
<figcaption>Velg art (SearchScreen), with the keyboard up</figcaption>
<div class="phone">
  <div class="statusbar">17:10</div>
  <div class="search-bar"><span class="lead">‹ Tilbake</span><div class="input">stor<span class="clear">✕</span></div></div>
  <div class="content">
    <div class="scroll" style="background:var(--surface)">
      <div class="species-row"><b style="font-weight:500">storskarv</b><span class="rl">NT</span><span class="sci">Phalacrocorax carbo</span></div>
      <div class="species-row"><b style="font-weight:500">storlom</b><span class="sci">Gavia arctica</span></div>
      <div class="species-row"><b style="font-weight:500">storspove</b><span class="rl">EN</span><span class="sci">Numenius arquata</span></div>
      <div class="species-row"><b style="font-weight:500">storfugl</b><span class="sci">Tetrao urogallus</span></div>
      <div class="species-row"><b style="font-weight:500">storjo</b><span class="sci">Stercorarius skua</span></div>
      <div class="species-row"><b style="font-weight:500">stork</b><span class="sci">Ciconia ciconia</span></div>
      <div class="species-row"><b style="font-weight:500">storlire</b><span class="sci">Ardenna gravis</span></div>
      <div class="species-row"><b style="font-weight:500">stormsvale</b><span class="rl">VU</span><span class="sci">Hydrobates leucorhous</span></div>
    </div>
    <div class="keyboard">keyboard</div>
  </div>
</div>
</figure>

<!-- ===================== DETAIL, EDIT (DetailScreen) ===================== -->
<figure id="detail-edit">
<figcaption>Endre observasjon (DetailScreen, editing). New: title "Ny observasjon", no Slett.</figcaption>
<div class="phone">
  <div class="statusbar">17:10</div>
  <div class="header"><span class="lead x">✕</span><span class="title">Endre observasjon</span><span class="trail">Kopier</span></div>
  <div class="content">
    <div class="scroll">
      <div class="field nav"><span class="label">Art</span><span class="value medium">gråmåke<span class="sci">Larus argentatus</span></span></div>
      <div class="field"><span class="value left" style="color:var(--muted);font-size:14px">Usikker artsbestemming</span><span class="checkbox" style="margin:-4px 0"></span></div>
      <div class="field nav"><span class="label">Lokalitet</span><span class="value medium"><span class="kind-dot"></span>Ladehammeren<span class="dist">1.1 km</span></span></div>
      <div class="field" style="padding-top:7px;padding-bottom:7px"><span class="label">Antall</span><span class="value"></span><div class="stepper"><span>−</span><b>4</b><span>+</span></div></div>
      <div class="field nav"><span class="label">Alder</span><span class="value medium">Adult</span></div>
      <div class="field nav"><span class="label">Kjønn</span><span class="value medium">Hann</span></div>
      <div class="field nav"><span class="label">Aktivitet</span><span class="value medium">Rastende</span></div>
      <div class="field nav"><span class="label">Åpen kommentar</span><span class="value"></span></div>
      <div class="field nav"><span class="label">Privat kommentar</span><span class="value"></span></div>
      <div class="field nav"><span class="label">Tid</span><span class="value">15. nov 17:05</span></div>
      <div class="field nav"><span class="label">Medobs.</span><span class="value medium">Kristin, Christian</span></div>
      <div class="field nav"><span class="label">Skjul t.o.m.</span><span class="value"></span></div>
    </div>
    <div class="bottom-bar"><span class="btn-text danger">Slett</span><span class="btn off">Lagre</span></div>
  </div>
  <div class="gesturebar"></div>
</div>
</figure>

<!-- ===================== OPTION DIALOG (DropdownRow) ===================== -->
<figure id="option-dialog">
<figcaption>Valgdialog (DropdownRow: Alder, Kjønn, Aktivitet, språk)</figcaption>
<div class="phone">
  <div class="statusbar">17:11</div>
  <div class="header"><span class="lead x">✕</span><span class="title">Endre observasjon</span><span class="trail">Kopier</span></div>
  <div class="content">
    <div class="scroll">
      <div class="field nav"><span class="label">Art</span><span class="value medium">gråmåke<span class="sci">Larus argentatus</span></span></div>
      <div class="field nav"><span class="label">Alder</span><span class="value medium">Adult</span></div>
    </div>
  </div>
  <div class="gesturebar"></div>
  <div class="scrim"><div class="dialog">
    <h3>Alder</h3>
    <div class="option">—</div><div class="option">Egg</div><div class="option">Pulli</div><div class="option on">Adult</div>
    <div class="option">1K</div><div class="option">1K+</div><div class="option">2K</div><div class="option">2K+</div>
    <div class="actions"><span class="btn-text">Avbryt</span></div>
  </div></div>
</div>
</figure>

<!-- ===================== CO-OBSERVERS (CoObserverScreen) ===================== -->
<figure id="coobs">
<figcaption>Medobservatører (CoObserverScreen)</figcaption>
<div class="phone">
  <div class="statusbar">17:11</div>
  <div class="header"><span class="lead">‹ Tilbake</span><span class="title">Medobservatører (2)</span><span class="trail">Ferdig</span></div>
  <div class="content">
    <div class="scroll">
      <div style="padding:4px 0 0"><div class="textfield placeholder">Søk eller skriv navn…</div></div>
      <div class="field" style="margin-top:4px"><span class="value left">Kristin Bøkestad</span><span class="switch on"></span></div>
      <div class="field"><span class="value left">Christian Sjødin</span><span class="switch on"></span></div>
    </div>
    <div class="bottom-bar"><span class="btn-outline" style="color:var(--on-bg)">Ingen medobservatører</span></div>
  </div>
  <div class="gesturebar"></div>
</div>
</figure>

<!-- ===================== LOCALITY PICKER (LocalityScreen, MapPicker.kt) ===================== -->
<figure id="locality">
<figcaption>Velg lokalitet (LocalityScreen). The map is a placeholder.</figcaption>
<div class="phone">
  <div class="statusbar">17:12</div>
  <div class="header"><span class="lead">‹ Tilbake</span><span class="title">Velg lokalitet</span><span class="trail">＋ Ny lokalitet</span></div>
  <div class="content">
    <div class="map">
      <div class="poly" style="left:40px;top:90px;width:70px;height:70px"></div><span class="label" style="left:75px;top:160px">hurtigbåthavna</span>
      <div class="poly" style="left:220px;top:200px;width:90px;height:90px"></div><span class="label" style="left:265px;top:290px">Ladehammeren</span>
      <div class="poly own" style="left:90px;top:400px;width:60px;height:60px"></div><span class="label" style="left:120px;top:460px;background:rgba(255,247,216,.95)">Ny plass ved Ladehammeren</span>
      <div class="gps" style="left:150px;top:250px"></div>
      <div class="ctrl" style="bottom:150px">◎</div><div class="ctrl" style="bottom:86px">+</div><div class="ctrl" style="bottom:22px">−</div>
      <span class="attribution">© OpenStreetMap-bidragsytere</span>
    </div>
    <div class="link-bar">Logg inn for å vise private lokaliteter</div>
  </div>
  <div class="gesturebar"></div>
</div>
</figure>

<!-- ===================== EXPORT (ExportScreen) ===================== -->
<figure id="export">
<figcaption>Eksporter (ExportScreen), before exporting. Sends the notes straight to «Kontroller funn».</figcaption>
<div class="phone">
  <div class="statusbar">17:12</div>
  <div class="header"><span class="lead">‹ Tilbake</span><span class="title">Eksporter</span><span></span></div>
  <div class="content">
    <div class="scroll" style="padding:12px 16px">
      <div style="font-size:14px;line-height:20px;color:var(--muted)">Eksporter alle observasjonene i lista til «Kontroller funn» på Artsobservasjoner. Vil du bare eksportere noen? Marker dem i lista først.</div>
      <div style="margin-top:12px"><span class="btn">Eksporter alle (29)</span></div>
    </div>
  </div>
  <div class="gesturebar"></div>
</div>
</figure>

  </div>

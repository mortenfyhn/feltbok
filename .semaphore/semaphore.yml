version: v1.0
name: Feltbok
# Build inside Semaphore's ready-made Android container (ships the SDK + JDK +
# the CI toolbox), so we don't hand-roll an SDK install on the base image.
agent:
  machine:
    type: e1-standard-2
    os_image: ubuntu2404
  containers:
    - name: main
      image: registry.semaphoreci.com/android:34

# On a new push, cancel any still-running pipeline for the same branch so the
# newest commit starts right away (also avoids the branch-push + PR double build).
auto_cancel:
  running:
    when: "true"

# Email me about every failed job on master (issue #163), so a broken CI can't go unnoticed. The
# email goes to the verified address of the ntfy account that owns $NTFY_TOKEN. Inline rather than
# a script so it still fires when `checkout` itself is what failed. The ref-type check skips PR
# builds, where SEMAPHORE_GIT_BRANCH is the PR's target branch.
global_job_config:
  secrets:
    - name: ntfy-token
  epilogue:
    on_fail:
      commands:
        - 'if [ "$SEMAPHORE_GIT_REF_TYPE" = branch ] && [ "$SEMAPHORE_GIT_BRANCH" = master ]; then curl --silent --show-error --fail -H "Authorization: Bearer $NTFY_TOKEN" -H "Email: yes" -H "Title: Feltbok CI failed" -d "$SEMAPHORE_JOB_NAME failed on $SEMAPHORE_GIT_BRANCH: https://fyhn.semaphoreci.com/workflows/$SEMAPHORE_WORKFLOW_ID" https://ntfy.sh/mortenfyhn-feltbok-ci; fi'

blocks:
  - name: Test & build
    dependencies: []
    task:
      prologue:
        commands:
          - checkout
          # `checkout` is a shallow clone without tags, so `git describe` would fall back to a
          # bare hash — both in the artifact filenames below and in the version string baked
          # into the APK. Fetch tags so both carry the real `v0.12-64-g…` describe.
          - git fetch --tags --force --quiet
      jobs:
        - name: unit tests + debug APK
          # The unit tests live in :shared (JVM) and :ui (Android host tests); the app module
          # has none left.
          # ktlintCheck gates formatting (run `just fmt` locally to fix).
          commands:
            - cache restore gradle-$(checksum app/build.gradle.kts)-$(checksum shared/build.gradle.kts)-$(checksum ui/build.gradle.kts)
            - ./gradlew ktlintCheck :ui:testAndroidHostTest :shared:jvmTest assembleDebug --console=plain --no-daemon
            - cache store gradle-$(checksum app/build.gradle.kts)-$(checksum shared/build.gradle.kts)-$(checksum ui/build.gradle.kts) ~/.gradle
      # Publish the debug APK as a workflow artifact so the Claude issue→PR loop (and
      # any branch build) gives a downloadable APK to test, without pulling the branch locally.
      # Named like the GitHub release APKs (feltbok-<describe>.apk) so they're recognisable.
      # on_pass only: a failed build won't have produced one.
      epilogue:
        on_pass:
          commands:
            - export VERSION=$(git describe --tags --always --dirty)
            - artifact push workflow app/build/outputs/apk/debug/app-debug.apk --destination feltbok-$VERSION.apk

  # Lint + test scripts/ Python on a plain VM (no Android container) - it needs no SDK/JDK.
  # Parallel with Test & build via dependencies: []. Grab ruff's prebuilt binary (like the
  # gh download below) to dodge a venv; the only third-party test dep is requests (pip-installed).
  - name: Lint (scripts/)
    dependencies: []
    task:
      agent:
        machine:
          type: e1-standard-2
          os_image: ubuntu2404
      prologue:
        commands:
          - checkout
      jobs:
        - name: ruff + unit tests (scripts/)
          commands:
            - curl -fsSL https://releases.astral.sh/github/ruff/releases/download/0.16.1/ruff-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C /tmp
            - /tmp/ruff-x86_64-unknown-linux-gnu/ruff --version
            - /tmp/ruff-x86_64-unknown-linux-gnu/ruff check scripts/
            - pip install --quiet --break-system-packages requests
            - python3 -m unittest discover -s scripts -p 'test_*.py'

  # Releases are cut locally with ./release.sh (see docs/release.md) — building the
  # signed APK on a connected machine is faster than a cold Semaphore tag build.

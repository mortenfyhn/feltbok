version: v1.0
name: Feltbok
# Build inside Semaphore's ready-made Android container (ships the SDK + JDK +
# the CI toolbox), so we don't hand-roll an SDK install on the base image.
agent:
  machine:
    type: e1-standard-2
    os_image: ubuntu2404
  containers:
    - name: main
      image: registry.semaphoreci.com/android:34

# On a new push, cancel any still-running pipeline for the same branch so the
# newest commit starts right away (also avoids the branch-push + PR double build).
auto_cancel:
  running:
    when: "true"

blocks:
  - name: Test & build
    dependencies: []
    task:
      prologue:
        commands:
          - checkout
      jobs:
        - name: unit tests + debug APK
          # testDebugUnitTest (not `test`) so we don't also compile+run the release
          # unit-test variant - same sources, no release-only tests, just wasted work.
          # ktlintCheck gates formatting (run `just fmt` locally to fix).
          commands:
            - cache restore gradle-$(checksum app/build.gradle.kts)
            - ./gradlew ktlintCheck testDebugUnitTest assembleDebug --console=plain --no-daemon
            - cache store gradle-$(checksum app/build.gradle.kts) ~/.gradle

  # Lint process/ Python on a plain VM (no Android container) - it needs no SDK/JDK,
  # just ruff. Parallel with Test & build via dependencies: []. Grab ruff's prebuilt
  # binary (like the gh download below) to dodge pip/venv setup on the base image.
  - name: Lint (process/)
    dependencies: []
    task:
      agent:
        machine:
          type: e1-standard-2
          os_image: ubuntu2404
      prologue:
        commands:
          - checkout
      jobs:
        - name: ruff (process/)
          commands:
            - curl -fsSL https://github.com/astral-sh/ruff/releases/latest/download/ruff-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C /tmp
            - /tmp/ruff-x86_64-unknown-linux-gnu/ruff check process/

  # Releases are cut locally with ./release.sh (see docs/release.md) — building the
  # signed APK on a connected machine is faster than a cold Semaphore tag build.

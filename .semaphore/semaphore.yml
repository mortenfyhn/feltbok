version: v1.0
name: Feltbok
# Build inside Semaphore's ready-made Android container (ships the SDK + JDK +
# the CI toolbox), so we don't hand-roll an SDK install on the base image.
agent:
  machine:
    type: e1-standard-2
    os_image: ubuntu2404
  containers:
    - name: main
      image: registry.semaphoreci.com/android:34

# On a new push, cancel any still-running pipeline for the same branch so the
# newest commit starts right away (also avoids the branch-push + PR double build).
auto_cancel:
  running:
    when: "true"

blocks:
  - name: Test & build
    task:
      prologue:
        commands:
          - checkout
      jobs:
        - name: unit tests + debug APK
          # testDebugUnitTest (not `test`) so we don't also compile+run the release
          # unit-test variant - same sources, no release-only tests, just wasted work.
          # ktlintCheck gates formatting (run `just fmt` locally to fix). Cache restore/store
          # live here (not the block prologue/epilogue) so the parallel ruff job - which has
          # an empty ~/.gradle - can't win the store race and poison the gradle cache.
          commands:
            - cache restore gradle-$(checksum app/build.gradle.kts)
            - ./gradlew ktlintCheck testDebugUnitTest assembleDebug --console=plain --no-daemon
            - cache store gradle-$(checksum app/build.gradle.kts) ~/.gradle
        # Parallel job: lint the process/ Python scripts. Runs alongside (not before) the
        # Kotlin job so a formatting nit doesn't hide test results. Throwaway venv because
        # the Ubuntu base is PEP-668 externally-managed (bare `pip install` is refused).
        - name: ruff (process/)
          commands:
            - python3 -m venv /tmp/ruff && /tmp/ruff/bin/pip install -q ruff
            - /tmp/ruff/bin/ruff check process/

  # Runs only when a v* tag is pushed: builds the signed release APK and publishes
  # it as a GitHub release. Needs the 'feltbok-signing' secret (keystore + passwords
  # + a GH token) - see docs/release.md. The android image has no gh CLI, so we drop
  # in a pinned gh binary just for the publish step.
  - name: Release
    run:
      when: "tag =~ '^v'"
    task:
      secrets:
        - name: feltbok-signing
      env_vars:
        - name: KEYSTORE_FILE
          value: /home/semaphore/feltbok-release.keystore
      # Reuse the dependency + Gradle-distribution cache the debug block already stored
      # (same key); otherwise a tag build cold-downloads everything from scratch.
      prologue:
        commands:
          - checkout
          - cache restore gradle-$(checksum app/build.gradle.kts)
      jobs:
        - name: signed APK + GitHub release
          commands:
            - git fetch --tags --force          # so `git describe` sees the tag for the in-app version
            - ./gradlew assembleRelease --console=plain --no-daemon
            # Publish under a recognisable name (feltbok-v0.5.apk), not Gradle's app-release.apk.
            - cp app/build/outputs/apk/release/app-release.apk "feltbok-$SEMAPHORE_GIT_TAG_NAME.apk"
            - curl -fsSL https://github.com/cli/cli/releases/download/v2.93.0/gh_2.93.0_linux_amd64.tar.gz | tar -xz -C /tmp
            - >-
              /tmp/gh_2.93.0_linux_amd64/bin/gh release create "$SEMAPHORE_GIT_TAG_NAME"
              "feltbok-$SEMAPHORE_GIT_TAG_NAME.apk"
              --title "Feltbok $SEMAPHORE_GIT_TAG_NAME"
              --notes-file docs/release-notes-install.md
              --generate-notes

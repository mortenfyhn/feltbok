version: v1.0
name: Feltbok
# Build inside Semaphore's ready-made Android container (ships the SDK + JDK +
# the CI toolbox), so we don't hand-roll an SDK install on the base image.
agent:
  machine:
    type: e1-standard-2
    os_image: ubuntu2404
  containers:
    - name: main
      image: registry.semaphoreci.com/android:34

# On a new push, cancel any still-running pipeline for the same branch so the
# newest commit starts right away (also avoids the branch-push + PR double build).
auto_cancel:
  running:
    when: "true"

blocks:
  - name: Test & build
    dependencies: []
    task:
      prologue:
        commands:
          - checkout
      jobs:
        - name: unit tests + debug APK
          # Test both flavors' debug variant (not `test`, which would also run the release
          # unit-test variants - same sources, no release-only tests, just wasted work).
          # ktlintCheck gates formatting (run `just fmt` locally to fix).
          commands:
            - cache restore gradle-$(checksum app/build.gradle.kts)
            - ./gradlew ktlintCheck testNorwayDebugUnitTest testSwedenDebugUnitTest assembleNorwayDebug --console=plain --no-daemon
            - cache store gradle-$(checksum app/build.gradle.kts) ~/.gradle
      # Publish the debug APK as a workflow artifact so the Claude issue→PR loop (and any
      # branch build) gives a downloadable APK to test, without pulling the branch locally.
      # on_pass only: a failed build won't have produced one.
      epilogue:
        on_pass:
          commands:
            - artifact push workflow app/build/outputs/apk/norway/debug/app-norway-debug.apk --destination feltbok-debug.apk

  # Lint + test scripts/ Python on a plain VM (no Android container) - it needs no SDK/JDK.
  # Parallel with Test & build via dependencies: []. Grab ruff's prebuilt binary (like the
  # gh download below) to dodge a venv; the only third-party test dep is requests (pip-installed).
  - name: Lint (scripts/)
    dependencies: []
    task:
      agent:
        machine:
          type: e1-standard-2
          os_image: ubuntu2404
      prologue:
        commands:
          - checkout
      jobs:
        - name: ruff + unit tests (scripts/)
          commands:
            - curl -fsSL https://github.com/astral-sh/ruff/releases/latest/download/ruff-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C /tmp
            - /tmp/ruff-x86_64-unknown-linux-gnu/ruff check scripts/
            - pip install --quiet requests
            - python3 -m unittest discover -s scripts -p 'test_*.py'

  # Releases are cut locally with ./release.sh (see docs/release.md) — building the
  # signed APK on a connected machine is faster than a cold Semaphore tag build.
